services:
  postgres:
    image: postgres:16
    container_name: spotfinder-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotfinder
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - spotfinder_local_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: spotfinder-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - spotfinder_local_minio_data:/data

volumes:
  spotfinder_local_postgres_data:
  spotfinder_local_minio_data: