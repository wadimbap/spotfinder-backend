name: stage-pipeline

on:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Spotless and Checkstyle
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile classes
        run: ./gradlew classes --no-daemon

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

  deploy-stage:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Build Docker image
        run: docker build -t spotfinder-backend:stage .

      - name: Deploy backend to stage
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt/apps/spotfinder/stage/backend:/work \
            -w /work \
            docker/compose:1.29.2 up -d

      - name: Check stage health
        run: |
          docker run --rm --network spotfinder-stage-net curlimages/curl:8.10.1 \
            -f http://spotfinder-stage-backend:8080/actuator/health