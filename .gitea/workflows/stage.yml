name: stage-pipeline

on:
  push:
    branches:
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run code style checks
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-deploy-stage:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build application JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Build Docker image
        run: docker build -t spotfinder-backend:stage .

      - name: Deploy backend to stage
        run: |
          docker rm -f spotfinder-stage-backend || true

          docker run -d \
            --name spotfinder-stage-backend \
            --restart unless-stopped \
            --network spotfinder-stage-net \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://spotfinder-stage-postgres:5432/spotfinder_stage \
            -e SPRING_DATASOURCE_USERNAME=admin \
            -e SPRING_DATASOURCE_PASSWORD=admin \
            -e SERVER_PORT=8080 \
            spotfinder-backend:stage

      - name: Check stage health
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network spotfinder-stage-net curlimages/curl:8.10.1 \
              -f http://spotfinder-stage-backend:8080/actuator/health; then
              echo "Stage backend is healthy"
              exit 0
            fi

            echo "Waiting for backend... attempt $i"
            sleep 5
          done

          echo "Stage backend healthcheck failed"
          docker logs spotfinder-stage-backend --tail 150
          exit 1