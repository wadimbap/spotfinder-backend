name: stage-pipeline

on:
  push:
    branches:
      - develop

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify and build JAR
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest test bootJar --no-daemon

      - name: Build Docker image
        run: docker build -t spotfinder-backend:stage .

      - name: Deploy backend to stage
        run: |
          docker ps -a --format '{{.Names}}' \
            | grep 'spotfinder-stage-backend' \
            | xargs -r docker rm -f

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt/apps/spotfinder/stage/backend:/work \
            -w /work \
            docker:27-cli sh -c "docker compose -p spotfinder-stage-backend up -d --remove-orphans"

      - name: Check stage health
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network spotfinder-stage-net curlimages/curl:8.10.1 \
              -f http://spotfinder-stage-backend:8080/actuator/health; then
              echo "Stage backend is healthy"
              exit 0
            fi

            echo "Waiting for backend... attempt $i"
            sleep 5
          done

          echo "Stage backend healthcheck failed"
          docker logs spotfinder-stage-backend --tail 150
          exit 1