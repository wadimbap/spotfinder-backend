name: stage-pipeline

on:
  push:
    branches:
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run code style checks
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-deploy-stage:
    runs-on: ubuntu-latest
    needs: quality
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}

    steps:
      - name: Checkout
        run: |
          git clone http://gitea:3000/admin/spotfinder-backend.git .
          git checkout ${{ gitea.sha }}

      - name: Validate deployment secrets before replacing containers
        run: bash .gitea/scripts/validate-secrets.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build application JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Build Docker image
        run: docker build -t spotfinder-backend:stage .

      - name: Deploy MinIO to stage
        run: |
          docker rm -f spotfinder-stage-minio || true

          docker volume create spotfinder-stage-minio-data || true

          docker run -d \
            --name spotfinder-stage-minio \
            --restart unless-stopped \
            --network spotfinder-stage-net \
            -e MINIO_ROOT_USER \
            -e MINIO_ROOT_PASSWORD \
            -v spotfinder-stage-minio-data:/data \
            minio/minio:latest server /data --console-address ":9001"

      - name: Check MinIO health
        run: |
          for i in $(seq 1 20); do
            if docker run --rm --network spotfinder-stage-net curlimages/curl:8.10.1 \
              -f http://spotfinder-stage-minio:9000/minio/health/live; then
              echo "Stage MinIO is healthy"
              exit 0
            fi

            echo "Waiting for MinIO... attempt $i"
            sleep 3
          done

          echo "Stage MinIO healthcheck failed"
          docker logs spotfinder-stage-minio --tail 100
          exit 1

      - name: Deploy backend to stage
        run: |
          docker rm -f spotfinder-stage-backend || true

          docker run -d \
            --name spotfinder-stage-backend \
            --restart unless-stopped \
            --network spotfinder-stage-net \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://spotfinder-stage-postgres:5432/spotfinder_stage \
            -e SPRING_DATASOURCE_USERNAME \
            -e SPRING_DATASOURCE_PASSWORD \
            -e JWT_SECRET \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SERVER_PORT=8080 \
            -e JWT_EXPIRATION_MINUTES=15 \
            -e AUTH_COOKIE_SECURE=true \
            -e AUTH_ALLOWED_ORIGINS=https://stage.deployflow.ru,https://stage-api.deployflow.ru \
            -e MINIO_ENDPOINT=http://spotfinder-stage-minio:9000 \
            -e MINIO_ACCESS_KEY \
            -e MINIO_SECRET_KEY \
            -e MINIO_BUCKET=spotfinder-stage \
            -e MINIO_INITIALIZE_BUCKET=false \
            spotfinder-backend:stage

      - name: Check stage health
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network spotfinder-stage-net curlimages/curl:8.10.1 \
              -f http://spotfinder-stage-backend:8080/actuator/health; then
              echo "Stage backend is healthy"
              exit 0
            fi

            echo "Waiting for backend... attempt $i"
            sleep 5
          done

          echo "Stage backend healthcheck failed"
          docker logs spotfinder-stage-backend --tail 150
          exit 1
