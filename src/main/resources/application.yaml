spring:
  application:
    name: spotfinder-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/spotfinder}
    username: ${SPRING_DATASOURCE_USERNAME:spotfinder}
    password: ${SPRING_DATASOURCE_PASSWORD:spotfinder}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info