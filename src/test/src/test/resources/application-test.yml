spring:
  application:
    name: spotfinder-backend-test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info